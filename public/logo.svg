<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- High Contrast Black & White Maximalism Badge -->
  <rect width="512" height="512" rx="64" fill="#000000" />
  <rect x="24" y="24" width="464" height="464" rx="48" fill="none" stroke="#ffffff" stroke-width="12" />
  <rect x="44" y="44" width="424" height="424" rx="36" fill="none" stroke="#ffffff" stroke-width="4" stroke-dasharray="16 8" />

  <!-- Mountain Peaks -->
  <polygon points="60,330 180,210 260,290 350,180 452,330" fill="#222222" stroke="#ffffff" stroke-width="6" />

  <!-- Water Lines -->
  <line x1="60" y1="350" x2="452" y2="350" stroke="#ffffff" stroke-width="6" />
  <line x1="90" y1="375" x2="422" y2="375" stroke="#ffffff" stroke-width="4" stroke-dasharray="24 12" />
  <line x1="130" y1="400" x2="382" y2="400" stroke="#ffffff" stroke-width="4" />

  <!-- Leaping Fish Silhouette in Pure White -->
  <path d="M 280,270 C 230,220 180,250 160,280 C 130,285 110,270 95,255 C 105,290 120,315 150,310 C 180,330 240,320 290,285 Z" fill="#ffffff" stroke="#000000" stroke-width="4" />
  <!-- Fish Tail & Fin -->
  <polygon points="95,255 70,240 85,275" fill="#ffffff" />
  <polygon points="95,255 65,285 90,275" fill="#ffffff" />
  <polygon points="210,242 235,215 245,246" fill="#ffffff" />

  <!-- Fishing Hook / Line Stroke -->
  <path d="M 330,110 C 370,160 380,230 350,290 C 335,320 300,340 270,330 C 245,320 245,295 260,285 C 275,275 290,290 280,305" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" />

  <!-- Bold Typography Overlay -->
  <text x="256" y="455" font-family="monospace" font-weight="900" font-size="34" fill="#ffffff" text-anchor="middle" letter-spacing="6">FISHING DAYS</text>
</svg>
