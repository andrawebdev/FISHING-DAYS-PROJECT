<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- High Contrast Black & White Maximalism Badge -->
  <rect width="512" height="512" rx="96" fill="#000000" />
  <rect x="28" y="28" width="456" height="456" rx="80" fill="none" stroke="#ffffff" stroke-width="20" />

  <!-- Mountain Peaks -->
  <polygon points="60,320 180,190 260,270 350,160 452,320" fill="#222222" stroke="#ffffff" stroke-width="10" />

  <!-- Water Lines -->
  <line x1="60" y1="350" x2="452" y2="350" stroke="#ffffff" stroke-width="10" />
  <line x1="100" y1="390" x2="412" y2="390" stroke="#ffffff" stroke-width="8" stroke-dasharray="24 16" />

  <!-- Leaping Fish in Pure White -->
  <path d="M 310,260 C 250,200 180,240 160,270 C 130,275 105,260 90,245 C 105,285 120,310 150,305 C 190,335 260,320 320,275 Z" fill="#ffffff" stroke="#000000" stroke-width="6" />
  <polygon points="90,245 60,225 80,265" fill="#ffffff" />
  <polygon points="90,245 55,275 85,265" fill="#ffffff" />

  <!-- Hook -->
  <path d="M 350,110 C 390,160 400,230 370,280 C 355,305 320,325 295,315 C 275,305 275,285 290,275 C 305,265 318,278 310,292" fill="none" stroke="#ffffff" stroke-width="12" stroke-linecap="round" />
</svg>
