<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- High Contrast Black Canvas -->
  <rect width="512" height="512" rx="112" fill="#000000" />
  
  <!-- Outer Maximalist Frame -->
  <rect x="24" y="24" width="464" height="464" rx="92" fill="none" stroke="#ffffff" stroke-width="20" />
  <rect x="52" y="52" width="408" height="408" rx="68" fill="none" stroke="#ffffff" stroke-width="6" stroke-dasharray="14 10" opacity="0.8" />

  <!-- Corner Accent Ticks -->
  <line x1="24" y1="120" x2="60" y2="120" stroke="#ffffff" stroke-width="8" />
  <line x1="24" y1="392" x2="60" y2="392" stroke="#ffffff" stroke-width="8" />
  <line x1="452" y1="120" x2="488" y2="120" stroke="#ffffff" stroke-width="8" />
  <line x1="452" y1="392" x2="488" y2="392" stroke="#ffffff" stroke-width="8" />

  <!-- Stylized Mountain & Pine Background Silhouettes -->
  <polygon points="76,330 156,220 226,300 326,170 436,330" fill="#181818" stroke="#ffffff" stroke-width="8" stroke-linejoin="round" />
  
  <!-- Lake Surface & Concentric Water Waves -->
  <path d="M 68,348 Q 160,336 256,348 T 444,348" fill="none" stroke="#ffffff" stroke-width="12" stroke-linecap="round" />
  <path d="M 104,382 Q 180,374 256,382 T 408,382" fill="none" stroke="#ffffff" stroke-width="8" stroke-dasharray="24 16" stroke-linecap="round" />
  <path d="M 152,414 Q 204,408 256,414 T 360,414" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" />

  <!-- Water Splash Droplets -->
  <circle cx="160" cy="310" r="7" fill="#ffffff" />
  <circle cx="352" cy="300" r="9" fill="#ffffff" />
  <circle cx="376" cy="322" r="6" fill="#ffffff" />

  <!-- Leaping Trophy Bass / Trout Silhouette -->
  <!-- Main Body Arched Dynamically -->
  <path d="M 334,188 C 300,140 220,154 168,206 C 130,244 116,280 94,292 C 122,296 148,284 172,266 C 160,284 144,302 120,314 C 158,318 196,298 226,274 C 274,236 320,242 352,228 C 362,224 372,208 360,196 C 352,188 342,188 334,188 Z" 
        fill="#ffffff" stroke="#000000" stroke-width="6" stroke-linejoin="round" />

  <!-- Caudal Fin / Tail -->
  <path d="M 116,288 C 88,270 64,250 56,238 C 66,270 78,294 100,302 Z" fill="#ffffff" />
  <path d="M 116,288 C 84,306 60,332 52,346 C 68,322 86,306 112,298 Z" fill="#ffffff" />

  <!-- Dorsal & Pectoral Fins -->
  <path d="M 238,154 C 264,130 292,126 312,138 C 294,152 272,160 252,164 Z" fill="#ffffff" />
  <path d="M 248,252 C 232,274 210,292 196,298 C 206,280 222,264 240,252 Z" fill="#ffffff" />

  <!-- Fish Eye & Gill Cutout (Negative Space in Black) -->
  <circle cx="340" cy="204" r="6" fill="#000000" />
  <circle cx="342" cy="203" r="2" fill="#ffffff" />
  <path d="M 314,196 Q 296,214 308,236" fill="none" stroke="#000000" stroke-width="5" stroke-linecap="round" />

  <!-- Fishing Line and Barbed Hook Arching from Top Right -->
  <!-- Line with tension curve -->
  <path d="M 400,64 C 440,140 430,220 380,266 C 360,286 332,298 310,290 C 286,280 286,252 304,240 C 322,228 338,244 330,262" 
        fill="none" stroke="#ffffff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Classic Barb Detail -->
  <polygon points="328,260 342,246 336,268" fill="#ffffff" />
  
  <!-- Top Line Guide Ring -->
  <circle cx="400" cy="64" r="8" fill="#ffffff" />
  <line x1="400" y1="64" x2="436" y2="28" stroke="#ffffff" stroke-width="10" stroke-linecap="round" />
</svg>
